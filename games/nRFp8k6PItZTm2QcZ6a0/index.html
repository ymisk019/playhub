<!doctype html>
<html lang="ar">
<meta charset="utf-8">
<title>لعبتي التجريبية</title>
<style>
  body { margin: 0; display: grid; place-content: center; min-height: 100vh;
         background: #171923; color: white; font: 24px sans-serif; text-align: center; }
  button { padding: 12px 20px; font: inherit; cursor: pointer; }
</style>
<h1>أهلاً بك في لعبتي!</h1>
<p>اضغط الزر لزيادة النقاط.</p>
<button onclick="document.querySelector('#score').textContent++">اجمع نقطة</button>
<p>النقاط: <span id="score">0</span></p>
</html>
